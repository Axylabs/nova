name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      # Keep `flatc` and the `flatbuffers` crate/npm versions aligned (README).
      - name: Install flatbuffers compiler
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y flatbuffers-compiler
          else
            brew install flatbuffers
          fi

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}

      - name: Install dependencies
        run: bun install

      - name: Generate (TypeBox → .fbs → flatc → glue)
        run: bun run generate

      - name: Build Rust cdylib
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Lint (oxlint — FP discipline rules)
        run: bunx oxlint

      - name: Test
        run: bun test

      - name: Benchmark (serialize)
        run: bun run bench:serialize

      - name: Bundle browser demo
        run: bun run build:client
