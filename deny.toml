# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/)
# Run locally with: cargo deny check --manifest-path rust/Cargo.toml
#
# Only licences actually present in the dependency tree: cargo-deny fails the
# licences check on unmatched allow entries (license-not-encountered), so a
# bigger allowlist breaks CI. When a dependency adds a licence, cargo-deny
# fails with license-not-allowed — review it, then add it here deliberately.

[advisories]
version = 2
# Fail CI on any security advisory or yanked crate.
yanked = "deny"

[bans]
# Warn on multiple versions of the same crate; keep the count reasonable.
multiple-versions = "warn"

[licenses]
# Permissive licenses only.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]
