# Pre-commit / pre-push hooks — https://github.com/evilmartians/lefthook
# Install once per clone: `bunx lefthook install`

pre-commit:
  parallel: true
  commands:
    qlty:
      # Git-aware umbrella check (oxc + actionlint + zizmor + trufflehog); only
      # reports issues on new/changed lines. Install tools once: `qlty install`.
      run: qlty check --no-formatters
    oxlint:
      # JS/TS only: this oxlint does not lint JSON and exits 1 with "No files
      # found to lint" on a JSON-only staged set — which is exactly every
      # release commit (`package.json` + Cargo.toml + CHANGELOG). JSON stays
      # covered by the whole-repo `bun run lint` in the pre-push hook.
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx oxlint {staged_files}
    typecheck:
      run: bun run typecheck

pre-push:
  parallel: true
  commands:
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
    test:
      run: bun test
